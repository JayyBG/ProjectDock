name: Build macOS DMG Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projectdock-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Apple Silicon binary
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          swift build -c release --arch arm64 --scratch-path .build-arm64

      - name: Build Intel binary
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          swift build -c release --arch x86_64 --scratch-path .build-x86_64

      - name: Create universal app bundle
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          ARM_BIN="$(find .build-arm64 -type f -path '*/release/ProjectDock' | head -n 1)"
          X86_BIN="$(find .build-x86_64 -type f -path '*/release/ProjectDock' | head -n 1)"

          if [[ -z "$ARM_BIN" || -z "$X86_BIN" ]]; then
            echo "Could not locate one or both release binaries."
            exit 1
          fi

          APP="dist/ProjectDock.app"
          ICONSET="build/ProjectDock.iconset"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          lipo -create "$ARM_BIN" "$X86_BIN" -output "$APP/Contents/MacOS/ProjectDock"
          chmod +x "$APP/Contents/MacOS/ProjectDock"

          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          swift scripts/generate_icon.swift build/ProjectDock-1024.png

          sips -z 16 16 build/ProjectDock-1024.png --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 build/ProjectDock-1024.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 build/ProjectDock-1024.png --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 build/ProjectDock-1024.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 build/ProjectDock-1024.png --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 build/ProjectDock-1024.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 build/ProjectDock-1024.png --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 build/ProjectDock-1024.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 build/ProjectDock-1024.png --out "$ICONSET/icon_512x512.png" >/dev/null
          cp build/ProjectDock-1024.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/ProjectDock.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>ProjectDock</string>
              <key>CFBundleIconFile</key>
              <string>ProjectDock</string>
              <key>CFBundleIdentifier</key>
              <string>com.jayybg.ProjectDock</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>ProjectDock</string>
              <key>CFBundleDisplayName</key>
              <string>ProjectDock</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/ProjectDock"

      - name: Create drag-to-Applications DMG
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          STAGE="dist/dmg"
          DMG="dist/ProjectDock-v${VERSION}.dmg"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "dist/ProjectDock.app" "$STAGE/ProjectDock.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "ProjectDock" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG"

          hdiutil verify "$DMG"
          shasum -a 256 "$DMG"

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "dist/ProjectDock-v${VERSION}.dmg" \
            --target "$GITHUB_SHA" \
            --title "ProjectDock ${TAG}" \
            --notes "First public ProjectDock release. Download the DMG, open it, and drag ProjectDock into Applications. The app is currently ad-hoc signed and not notarized, so macOS may require right-clicking ProjectDock and choosing Open on first launch."
